<script type="module">
import * as THREE from "three";

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const clamp01 = k => Math.max(0, Math.min(1, k));
const lerp = (a, b, k) => a + (b - a) * k;
const show = (el, on) => el.classList.toggle("hidden", !on);
const E = { out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t, io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* poster space: 1024 x 1536 px → 1 x 1.5 units, centred */
const PX = 1 / 1024, toX = x => x * PX - 0.5, toY = y => 0.75 - y * PX;
const TE = { print: { x: 590, y: 599.5, w: 192.25, h: 285, pivot: { x: 628.4, y: 685 }, angle: 19 }, rest: { x: 697, y: 372, w: 230.7, h: 342 } };
const NAHI = { x: 391, y: 9, w: 402, h: 358 };
const CRACK = { x: 545, y: 660 }, STAMP = { x: 874, y: 646 }, BEAM = { a: { x: 452, y: 612 }, b: { x: 842, y: 848 } }, PILLAR = { x: 908, y: 1380 };

/* ============ sound: synthesized, nothing to download ============ */
const ctx = new (window.AudioContext || window.webkitAudioContext)(), master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
const mkBuf = (sec, fn) => { const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0); fn(d); return b; };
const noiseBuf = mkBuf(2, d => { for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; });
const brownBuf = mkBuf(3, d => { let l = 0; for (let i = 0; i < d.length; i++) { l = (l + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } });
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function noise({ dur = .3, type = "bandpass", f0 = 800, f1 = f0, q = 1, gain = .4, a = .005, buf = noiseBuf, delay = 0 }) {
  const t = ctx.currentTime + delay, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = buf; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, a, gain, dur); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur + .05); }
function tone({ f = 440, f1 = f, dur = .3, type = "sine", gain = .3, a = .005, delay = 0 }) {
  const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  env(g, t, a, gain, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05); }
const SFX = {
  whoosh: (g = .25) => noise({ dur: .5, f0: 300, f1: 2400, q: 1.2, gain: g, a: .2 }),
  pop: () => { tone({ f: 520, f1: 900, dur: .09, gain: .18 }); noise({ dur: .06, f0: 2500, gain: .1 }); },
  dha: (d = 0) => { tone({ f: 190, f1: 95, dur: .5, gain: .55, delay: d }); tone({ f: 380, f1: 360, dur: .2, type: "triangle", gain: .12, delay: d }); noise({ dur: .05, f0: 2200, gain: .18, delay: d }); },
  na: (d = 0) => { tone({ f: 330, f1: 300, dur: .24, type: "triangle", gain: .22, delay: d }); noise({ dur: .04, f0: 4000, gain: .12, delay: d }); },
  step: () => noise({ dur: .07, type: "lowpass", f0: 500, gain: .22 }),
  clink: (d = 0) => { tone({ f: 2400 + Math.random() * 600, dur: .14, type: "triangle", gain: .1, delay: d }); tone({ f: 3900, dur: .1, gain: .05, delay: d + .01 }); },
  thunk: () => { tone({ f: 130, f1: 45, dur: .3, gain: .8 }); noise({ dur: .09, type: "lowpass", f0: 900, gain: .45 }); },
  deflate: () => { tone({ f: 420, f1: 110, dur: .7, type: "sawtooth", gain: .06 }); noise({ dur: .6, f0: 1800, f1: 400, gain: .12 }); },
  honk: () => [0, .34].forEach(d => { tone({ f: 415, dur: .22, type: "square", gain: .07, delay: d }); tone({ f: 520, dur: .22, type: "square", gain: .05, delay: d }); }),
  rumble: dur => noise({ dur, type: "lowpass", f0: 90, f1: 170, gain: .9, a: dur * .8, buf: brownBuf }),
  crack: () => { noise({ dur: .14, type: "highpass", f0: 1800, gain: .6 }); tone({ f: 95, f1: 38, dur: .35, gain: .6 }); },
  crash: () => { noise({ dur: 1.5, type: "lowpass", f0: 3500, f1: 250, gain: .95, a: .01 }); tone({ f: 62, f1: 28, dur: 1.3, gain: .95 });
    for (let i = 0; i < 10; i++) noise({ dur: .08, f0: 600 + Math.random() * 1800, gain: .25, delay: .35 + i * .11 + Math.random() * .08 }); },
  heart: () => { tone({ f: 62, f1: 40, dur: .14, gain: .9 }); tone({ f: 58, f1: 38, dur: .14, gain: .7, delay: .25 }); },
  static: () => noise({ dur: .35, type: "highpass", f0: 2000, gain: .3, a: .01 }),
  sting: () => { [[440, 0], [554, 0], [659, 0], [880, .18]].forEach(([f, d]) => tone({ f, dur: .5, type: "sawtooth", gain: .045, delay: d })); tone({ f: 70, f1: 40, dur: .6, gain: .6 }); noise({ dur: .45, f0: 500, f1: 4000, gain: .15, a: .25 }); },
  blip: () => tone({ f: 1320, dur: .08, type: "square", gain: .04 }),
  bell: (f = 392) => { tone({ f, dur: 2.6, gain: .12, a: .01 }); tone({ f: f * 2.01, dur: 1.4, gain: .03 }); tone({ f: f * 3.02, dur: .8, gain: .015 }); },
  rewind: dur => { const t = ctx.currentTime, o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(1400, t + dur * .3); o.frequency.exponentialRampToValueAtTime(900, t + dur);
    lfo.frequency.value = 14; lg.gain.value = 60; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .3); g.gain.setValueAtTime(.05, t + dur - .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(master); o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
    noise({ dur, f0: 3000, f1: 5000, q: 2, gain: .12, a: .3 }); for (let i = 0; i < dur * 7; i++) noise({ dur: .03, f0: 6000, gain: .06, delay: i / 7 }); },
  stop: () => { tone({ f: 900, f1: 120, dur: .25, type: "sawtooth", gain: .08 }); noise({ dur: .12, type: "lowpass", f0: 1200, gain: .3 }); },
  marker: () => { noise({ dur: .4, f0: 2600, f1: 3400, q: 6, gain: .16, a: .02 }); tone({ f: 1800, f1: 2300, dur: .3, type: "triangle", gain: .03 }); },
  peel: () => noise({ dur: .32, type: "highpass", f0: 1200, f1: 5000, gain: .22, a: .01 }),
  chime: (d = 0) => [261.6, 329.6, 392, 523.3].forEach((f, i) => { tone({ f, dur: 1.8, gain: .15, delay: d + i * .14 }); tone({ f: f * 2.76, dur: .7, gain: .03, delay: d + i * .14 }); }),
};
let drone = null;
function droneOn() { if (drone) return; const g = ctx.createGain(); g.gain.value = 0; const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 520;
  const os = [110, 110.6, 165, 220.4].map(fr => { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.connect(f); o.start(); return o; });
  f.connect(g).connect(master); g.gain.linearRampToValueAtTime(.04, ctx.currentTime + 1.2); drone = { g, os }; }
function droneOff() { if (!drone) return; const d = drone; drone = null; d.g.gain.linearRampToValueAtTime(0, ctx.currentTime + .6); setTimeout(() => d.os.forEach(o => o.stop()), 800); }
const unlock = () => { if (ctx.state !== "running") ctx.resume(); show($("snd"), false); };
setTimeout(() => { if (ctx.state !== "running") show($("snd"), true); }, 600);

/* ============ textures ============ */
const loader = new THREE.TextureLoader();
const tex = url => new Promise((res, rej) => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, rej));
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.userData.aspect = h / w; return t; }
function svgTex(svg, w, h) { return new Promise(res => { const im = new Image(); im.onload = () => res(canvasTex(w, h, x => x.drawImage(im, 0, 0, w, h)));
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
const fontsReady = Promise.all(["800 60px 'Anek Devanagari'", "800 40px 'Mukta'", "700 40px 'Mukta'", "30px 'Special Elite'"].map(f => document.fonts.load(f))).catch(() => {});
const grit = (x, w, h, n = 300) => { x.save(); x.globalCompositeOperation = "destination-out"; for (let i = 0; i < n; i++) { x.globalAlpha = Math.random() * .6; x.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 3, 2); } x.restore(); };
function tornPaper(x, w, h, seed, fill = "#efe5d2") {
  const r = rng(seed); x.beginPath(); x.moveTo(0, 10 + r() * 10);
  for (let px = 0; px <= w; px += 14) x.lineTo(px, 6 + r() * 16);
  for (let px = w; px >= 0; px -= 14) x.lineTo(px, h - 6 - r() * 16);
  x.closePath(); x.fillStyle = fill; x.fill(); x.save(); x.clip();
  for (let i = 0; i < w * h / 90; i++) { x.fillStyle = `rgba(80,55,25,${r() * .06})`; x.fillRect(r() * w, r() * h, 1 + r() * 3, 1); }
  x.restore(); }
function wavy(x, x0, x1, y, color, lw = 5) { x.strokeStyle = color; x.lineWidth = lw; x.lineCap = "round"; x.beginPath(); x.moveTo(x0, y); for (let px = x0; px <= x1; px += 8) x.lineTo(px, y + Math.sin(px * .09) * 3); x.stroke(); }
/* narration: clean floating type, no box. "*word*" = warm red emphasis */
function lineTex(hi, en, { size = 84 } = {}) {
  const W = 1200, HF = `800 ${size}px 'Anek Devanagari'`, EF = "30px 'Special Elite'", m = document.createElement("canvas").getContext("2d");
  const toks = []; hi.split(/(\*[^*]+\*)/).filter(Boolean).forEach(seg => { const em = seg.startsWith("*"); seg.replace(/\*/g, "").split(/(\s+)/).filter(Boolean).forEach(w => toks.push({ w, em })); });
  m.font = HF; const lines = [[]]; let lw = 0;
  toks.forEach(t => { const tw = m.measureText(t.w).width; if (lw + tw > W - 80 && t.w.trim()) { lines.push([]); lw = 0; } if (!t.w.trim() && !lines[lines.length - 1].length) return; lines[lines.length - 1].push({ ...t, tw }); lw += tw; });
  const lh = size * 1.18, H = 40 + lines.length * lh + (en ? 70 : 10) + 30;
  return canvasTex(W, H, (x, w) => {
    x.textBaseline = "alphabetic"; x.shadowColor = "rgba(0,0,0,.55)"; x.shadowBlur = 18; x.shadowOffsetY = 4;
    lines.forEach((ln, i) => { const tot = ln.reduce((s, t) => s + t.tw, 0); let px = (w - tot) / 2; const y = 40 + size + i * lh; x.font = HF;
      ln.forEach(t => { x.fillStyle = t.em ? "#ff5a5a" : "#f6eedd"; x.fillText(t.w, px, y); px += t.tw; }); });
    if (en) { x.font = EF; x.fillStyle = "rgba(246,238,221,.72)"; x.textAlign = "center"; x.fillText(en, w / 2, 40 + lines.length * lh + 46); }
  }); }
function yearTex(num, tag) { return canvasTex(900, 600, (x, w, h) => {
  x.translate(w / 2, h / 2 - 30); x.rotate(-.06); x.textAlign = "center"; x.font = "800 300px 'Anek Devanagari'";
  x.fillStyle = "rgba(21,16,11,.9)"; x.fillText(num, 12, 100); x.fillStyle = "#c8102e"; x.fillText(num, 0, 88);
  x.rotate(.1); x.font = "800 58px 'Mukta'"; const tw = x.measureText(tag).width; x.fillStyle = "#15100b"; x.fillRect(-tw / 2 - 26, 150, tw + 52, 92); x.fillStyle = "#f3e9d6"; x.fillText(tag, 0, 218);
  x.setTransform(1, 0, 0, 1, 0, 0); grit(x, w, h, 500); }); }
function newsTex(head, sub) { return canvasTex(1240, 250, (x, w, h) => {
  x.fillStyle = "#c8102e"; x.fillRect(0, 30, 270, 150); x.fillStyle = "#fff"; x.font = "800 58px 'Anek Devanagari'"; x.textBaseline = "middle"; x.textAlign = "center"; x.fillText("ब्रेकिंग", 135, 110);
  x.fillStyle = "#f7f4ee"; x.fillRect(270, 30, w - 270, 150); x.textAlign = "left"; x.fillStyle = "#111"; x.font = "800 60px 'Anek Devanagari'"; x.fillText(head, 300, 90);
  x.fillStyle = "#555"; x.font = "700 34px 'Mukta'"; x.fillText(sub, 302, 150); x.fillStyle = "#c8102e"; x.fillRect(270, 176, w - 270, 6); }); }
function tickerTex() { const t = canvasTex(2048, 72, (x, w, h) => { x.fillStyle = "#111"; x.fillRect(0, 0, w, h); x.fillStyle = "#f2b33d"; x.font = "800 38px 'Mukta'"; x.textBaseline = "middle";
  const s = "ठेकेदार फ़रार   •   अधिकारी निलंबित   •   मुआवज़े की घोषणा   •   जाँच समिति गठित   •   "; let px = 0; while (px < w) { x.fillText(s, px, h / 2 + 2); px += x.measureText(s).width; } });
  t.wrapS = THREE.RepeatWrapping; return t; }
const staticTex = () => canvasTex(256, 384, (x, w, h) => { const d = x.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); });

/* shadow-puppet characters */
const K = "#15100b", HOLE = "#f3c47a";
const holes = pts => pts.map(([x, y, r = 3.2]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${HOLE}" opacity=".85"/>`).join("");
function contractorSVG(pose) {
  const arm = pose === "offer" ? `<path d="M196 170 Q236 200 272 194" fill="none" stroke="${K}" stroke-width="24" stroke-linecap="round"/><circle cx="276" cy="193" r="13" fill="${K}"/>`

    <path d="M196 188 l16 -6 l2 14 z" fill="#c8102e"/>${holes([[150, 205], [128, 232], [168, 236], [148, 262], [184, 270], [132, 290], [166, 296, 2.4], [116, 360, 2.4], [196, 366, 2.4]])}</svg>`; }

  const sRed = plane(T.sRed, .17, .17, 14), sGr = plane(T.sGreen, .17, .17, 14); sRed.position.set(0, .14, .008); sGr.position.set(0, .14, .008);
  const bags = [0, 1, 2].map(i => { const b = plane(T.bag, .1, .133, 12); b.geometry.translate(0, .066, 0); b.position.set(-.17 + i * .13, -.255, .006); return b; });
  const minus = plane(T.minus, .15, .07, 14), skip = plane(T.skip, .3, .09, 14); minus.position.set(.11, 0, .008); skip.position.set(-.02, .15, .008);
  card.add(con, off, envM, bub1, bub2, sRed, sGr, minus, skip, ...bags);
  // things that float in front of the poster
  const fl = new THREE.Group(); g.add(fl);
  const scrim = plane(T.scrim, 1.5, 1.1, 19); scrim.position.z = .3; g.add(scrim);
  const lines = {}; ["lYatri", "lYou", "lPrice", "lPrice2", "w1", "w2", "w3", "lStand"].forEach(k => lines[k] = floating(T[k], .9, 21, fl, false));
  const years = { y2019: floating(T.y2019, .78, 23, fl), y2026: floating(T.y2026, .78, 23, fl) };
  const news = { n1: floating(T.n1, .98, 22, fl), n2: floating(T.n2, .98, 22, fl), n3: floating(T.n3, .98, 22, fl) };
  const ticker = plane(T.ticker, 1.0, .035, 22); ticker.position.set(0, -.64, .34); g.add(ticker); T.ticker.repeat.x = .5;
  const stat = plane(T.stat, 1.02, 1.52, 29); stat.position.z = .44; g.add(stat);
  const end = floating(T.end, .9, 25, fl);
  const vhs = plane(T.vhs, 1.04, 1.54, 30); vhs.position.z = .45; g.add(vhs);
  const band = plane(T.band, 1.04, .09, 31); band.material.blending = THREE.AdditiveBlending; band.position.z = .451; g.add(band);
  const rw = plane(T.rw, .5, .125, 32); rw.position.set(-.2, .66, .452); g.add(rw);
  return { root, g, head, cutL, cutR, cutRPivot, front, nahi, nahiHome, strike, te, pivot, poses, beam, beamGlow, teGlow, stampG, dim, parts, puffs,
    stageSh, flip, con, off, envM, bub1, bub2, sRed, sGr, bags, minus, skip, scrim, lines, years, news, ticker, stat, end, vhs, band, rw };
}

/* ============ the story — a pure function of time, so it can truly play backwards ============ */
const D = 12.6, LA = 51.6, RWD = 4.8, LB = 44.0;   // the moment of the offer · end of the bribe story · rewind length · end of the honest story
function makeStory(S) {
  const spans = [], cues = [];
  const at = (a, f, br) => spans.push({ a, b: a, f, br });
  const span = (a, b, f, br) => spans.push({ a, b, f, br });
  const cue = (time, f, br) => cues.push({ time, f, br });
  const op = (m, v) => { m.material.opacity = v; m.visible = v > .003; };
  const V = {};
  const hand = { x: -.133, y: -.08 }, take = { x: .106, y: -.2 };
  const slam = (m, a, big = 2, br) => span(a, a + .32, k => { op(m, clamp01(k * 3)); m.scale.setScalar(1 + (1 - E.out(k)) * big); }, br);
  const life = (k, a, b, fin = .7, fout = .6) => { const t = k * (b - a); return [clamp01(t / fin), clamp01((b - a - t) / fout)]; };
  /* one narration line at a time: a soft dark scrim rises, the words drift forward out of the poster */
  const line = (m, a, b, br, y = -.3, scrim = .85) => span(a, b, k => { const [i, o] = life(k, a, b, .9, .7), v = Math.min(E.out(i), o);
    op(m, v); m.position.set(0, y + (1 - E.out(i)) * -.03, .36 + E.out(i) * .05); m.scale.setScalar(.96 + .04 * E.out(i)); V.scrim = Math.max(V.scrim, v * scrim); V.scrimY = y; }, br);
  const bubble = (m, map, a, b, br) => span(a, b, k => { const [i, o] = life(k, a, b, .3, .35); m.material.map = map; op(m, Math.min(i * 1.5, o)); m.scale.setScalar(1 + (1 - E.back(i)) * .5); }, br);
  const yearCard = (m, a, b, br) => span(a, b, k => { const [i, o] = life(k, a, b, .35, .55);
    op(m, Math.min(clamp01(i * 3), o)); m.scale.setScalar(1 + (1 - E.out(i)) * 1.4); m.position.set(0, .14, .38 + (1 - o) * .25); m.rotation.z = -.04;
    const sh = m.userData.sh; op(sh, Math.min(i, o) * .45); sh.position.set(.03, .1, .2); sh.scale.setScalar(m.scale.x); }, br);
  const lowerThird = (m, a, b) => span(a, b, k => { const [i, o] = life(k, a, b, .45, .4), e = E.out(i);
    op(m, Math.min(i * 2, o)); m.position.set(lerp(-1.1, 0, e), -.46, .34); const sh = m.userData.sh; op(sh, Math.min(i, o) * .4); sh.position.set(m.position.x + .02, -.49, .2); V.news = 1; }, "A");
  const walk = (k, x0, x1) => { S.con.position.x = lerp(x0, x1, k); S.con.position.y = -.105 + Math.abs(Math.sin(k * Math.PI * 5)) * .012; S.con.rotation.z = Math.sin(k * Math.PI * 5) * .04; };
  const flipTo = (k, up) => { V.flip = up ? lerp(Math.PI / 2, 0, E.back(k)) : lerp(0, Math.PI / 2, E.in(k)); };
  const envAt = (x, y, rot = 0) => { op(S.envM, 1); S.envM.position.set(x, y, .006); S.envM.rotation.z = rot; };

  /* ---------- shared: 2019, the offer ---------- */
  span(0, .9, k => V.dHead = E.back(k)); span(.3, 1.2, k => V.dTe = E.back(k)); span(.6, 1.5, k => V.dCut = E.back(k)); span(.9, 1.8, k => V.dFront = E.back(k));
  yearCard(S.years.y2019, 2.2, 5.0);
  span(5.5, 6.3, k => flipTo(k, true));
  span(6.8, 9.0, k => { op(S.con, clamp01(k * 4)); walk(E.out(k), -.42, -.22); });
  at(9.4, () => { S.con.material.map = T.cOffer; S.con.rotation.z = 0; envAt(hand.x, hand.y); });
  bubble(S.bub1, T.bChai, 9.7, 12.3);
  cue(2.2, () => SFX.dha()); cue(5.5, () => { SFX.whoosh(); droneOn(); }); [7.0, 7.5, 8.0, 8.5].forEach(c => cue(c, SFX.step)); cue(9.4, () => SFX.na());

  /* ---------- branch A: the bribe ---------- */
  const A = "A";
  span(D, D + .7, k => { const e = E.io(k); envAt(lerp(hand.x, take.x, e), lerp(hand.y, take.y, e) + Math.sin(e * Math.PI) * .07, e * .6); }, A);
  at(D + .35, () => { S.off.material.map = T.oTake; }, A);
  at(D + .9, () => { op(S.envM, 0); S.off.material.map = T.oStamp; S.con.material.map = T.cWalk; }, A);
  at(14.3, () => { S.off.material.map = T.oIdle; }, A);
  slam(S.sRed, 14.3, 2, A); bubble(S.bub2, T.bPass, 14.5, 16.8, A);
  span(17.2, 17.7, k => { V.charFade = k; V.sRedFade = k; }, A);
  [0, 1, 2].forEach(i => span(17.9 + i * .45, 18.3 + i * .45, k => { op(S.bags[i], clamp01(k * 3)); S.bags[i].scale.set(1, E.back(k), 1); }, A));
  span(19.6, 20.4, k => S.bags[2].scale.set(1 + k * .08, lerp(1, .58, E.out(k)), 1), A); slam(S.minus, 19.8, 1, A);
  slam(S.skip, 21.0, 1.5, A);
  span(22.6, 23.3, k => flipTo(k, false), A);
  yearCard(S.years.y2026, 23.8, 26.6, A);
  line(S.lines.lYatri, 27.0, 29.4, A); line(S.lines.lYou, 29.6, 32.0, A);
  span(32.2, 34.4, k => V.shake = .004 + k * k * .02, A);
  span(34.2, 35.3, k => V.lean = E.in(k) * .14, A); span(35.3, 36.1, k => V.lean = .14 + Math.sin(k * Math.PI * 2.5) * .025 * (1 - k), A);
  span(34.4, 35.8, k => { V.tePose = ["print", "fallen", E.in(k)]; V.teOp = 1 - clamp01((k - .7) / .3); }, A);
  span(34.4, 35.1, k => V.shake = .026 * (1 - k), A);
  // the news cycle
  span(36.6, 36.95, k => V.stat = Math.sin(k * Math.PI) * .85, A);
  lowerThird(S.news.n1, 36.9, 39.8); lowerThird(S.news.n2, 40.0, 42.6); lowerThird(S.news.n3, 42.8, 45.4);
  span(36.9, 45.4, k => V.tick = k, A);
  span(45.4, 45.7, k => V.stat = Math.sin(k * Math.PI) * .6, A);
  cue(D + .35, () => { SFX.clink(); SFX.clink(.09); SFX.clink(.19); }, A); cue(14.3, SFX.thunk, A);
  [17.9, 18.35, 18.8].forEach(c => cue(c, SFX.pop, A)); cue(19.6, SFX.deflate, A); cue(21.0, SFX.thunk, A);
  cue(22.6, () => { SFX.whoosh(); droneOff(); }, A); cue(23.8, () => SFX.dha(), A); cue(27.0, SFX.honk, A);
  cue(32.2, () => SFX.rumble(2.2), A); cue(33.8, SFX.crack, A); cue(34.4, SFX.crash, A);
  cue(36.6, SFX.static, A); cue(36.9, SFX.sting, A); cue(40.0, SFX.blip, A); cue(42.8, SFX.blip, A); cue(45.4, SFX.static, A);
  // silence after the noise
  line(S.lines.lPrice, 46.0, 48.4, A, -.1, .9); line(S.lines.lPrice2, 48.8, 51.4, A, -.1, .9);
  cue(48.8, SFX.heart, A); cue(50.0, SFX.heart, A);
  // (the rewind begins at LA)

  /* ---------- branch B: the pause, the question, one 'no' ---------- */
  const B = "B";
  line(S.lines.w1, D + .4, 15.4, B, .02, .92);
  line(S.lines.w2, 15.9, 19.4, B, .02, .92);
  line(S.lines.w3, 19.9, 22.6, B, .02, .92);
  at(23.2, () => { S.off.material.map = T.oNo; }, B);
  bubble(S.bub2, T.bNo, 23.3, 25.8, B);
  span(26.0, 26.6, k => { const e = E.io(k); envAt(lerp(hand.x, hand.x - .06, e), hand.y + Math.sin(e * Math.PI) * .05); }, B);
  at(26.7, () => { S.con.material.map = T.cWalk; S.con.scale.x = -1; op(S.envM, 0); }, B);
  bubble(S.bub1, T.bOops, 26.8, 28.0, B);
  span(28.2, 29.3, k => { walk(E.in(k), -.22, -.5); V.conOut = clamp01((k - .5) * 2); }, B);
  slam(S.sGr, 29.7, 2, B);
  span(31.2, 31.9, k => flipTo(k, false), B);
  span(32.5, 34.1, k => { V.beam = E.out(k); V.beamGlow = Math.sin(k * Math.PI) * .9; }, B);
  span(34.6, 35.9, k => { V.tePose = ["print", "rest", E.back(k)]; V.teGlow = Math.sin(k * Math.PI); }, B);
  slam(S.stampG, 36.5, 1.6, B);
  span(37.6, 38.0, k => { op(S.strike, 1); S.strike.scale.x = Math.max(.0001, E.out(k)); }, B);
  span(38.2, 38.55, k => V.nahiWob = Math.sin(k * Math.PI * 2) * .05, B);
  span(38.8, 39.8, k => V.nahiFall = k, B);
  line(S.lines.lStand, 40.4, 43.4, B, -.44, .7);
  span(LB, LB + 1.0, k => { const e = E.out(k); op(S.end, clamp01(k * 2)); S.end.position.set(0, lerp(-1.4, -.24, e), .37); S.end.rotation.z = lerp(.35, -.025, e);
    const sh = S.end.userData.sh; op(sh, .45 * k); sh.position.set(.025, S.end.position.y - .035, .2); sh.rotation.z = S.end.rotation.z; }, B);
  cue(D + .4, () => SFX.bell(294), B); cue(15.9, () => SFX.bell(330), B); cue(19.9, () => SFX.bell(392), B);
  cue(23.2, () => { SFX.dha(); SFX.dha(.18); }, B); cue(26.0, () => SFX.whoosh(.15), B); cue(26.8, () => SFX.na(), B);
  cue(29.7, SFX.thunk, B); cue(31.2, () => { SFX.whoosh(); droneOff(); }, B); cue(32.5, () => SFX.chime(), B); cue(34.6, () => SFX.whoosh(.2), B);
  cue(36.5, () => { SFX.thunk(); SFX.chime(.15); }, B); cue(37.6, SFX.marker, B); cue(38.8, () => { SFX.peel(); SFX.whoosh(); }, B); cue(LB, () => SFX.whoosh(.2), B);

  /* draw the poster at story time t on branch br */
  function render(t, br, vhs) {
    Object.assign(V, { dHead: 0, dTe: 0, dCut: 0, dFront: 0, flip: Math.PI / 2, shake: 0, lean: 0, tePose: ["print", "print", 0], teOp: 1, teGlow: 0, beam: 0, beamGlow: 0,
      charFade: 0, sRedFade: 0, conOut: 0, nahiWob: 0, nahiFall: 0, scrim: 0, scrimY: 0, stat: 0, tick: -1, news: 0 });
    S.con.material.map = T.cWalk; S.con.scale.x = 1; S.con.position.set(-.42, -.105, .003); S.con.rotation.z = 0; op(S.con, 0);
    S.off.material.map = T.oIdle; op(S.off, 1);
    [S.envM, S.bub1, S.bub2, S.sRed, S.sGr, S.minus, S.skip, S.stampG, S.strike, S.end, ...S.bags, ...Object.values(S.lines), ...Object.values(S.years), ...Object.values(S.news)]
      .forEach(m => { op(m, 0); m.scale.setScalar(1); m.userData.sh && op(m.userData.sh, 0); });
    S.bags.forEach(b => b.scale.set(1, 1, 1)); S.strike.scale.x = .0001;
    for (const s of spans) { if (s.br && s.br !== br) continue; if (t < s.a) continue; s.f(s.b > s.a ? clamp01((t - s.a) / (s.b - s.a)) : 1); }
    S.head.position.z = .05 * V.dHead; S.cutL.position.z = .11 * V.dCut; S.cutRPivot.position.z = .11 * V.dCut + V.lean * .1; S.cutRPivot.rotation.z = V.lean; S.front.position.z = .18 * V.dFront;
    S.stampG.position.z = .19 * V.dFront; S.beam.position.z = .115 * V.dCut; S.beamGlow.position.z = .112 * V.dCut; S.teGlow.position.z = .04 * V.dCut; S.dim.position.z = .2 * V.dFront;
    const [pa, pb, pk] = V.tePose, P0 = S.poses[pa], P1 = S.poses[pb];
    S.pivot.position.lerpVectors(P0.pos, P1.pos, pk); S.pivot.position.z += .055 * V.dTe; S.pivot.rotation.z = lerp(P0.rot, P1.rot, pk); S.pivot.scale.setScalar(lerp(P0.s, P1.s, pk)); op(S.te, V.teOp);
    op(S.teGlow, V.teGlow); op(S.beam, V.beam > 0 ? 1 : 0); S.beam.scale.x = Math.max(.0001, V.beam); op(S.beamGlow, V.beamGlow);
    const nf = E.in(V.nahiFall); S.nahi.position.set(S.nahiHome.x + nf * .18, S.nahiHome.y - nf * 1.7, .051 * V.dHead + nf * .15); S.nahi.rotation.z = V.nahiWob - nf * 1.2; op(S.nahi, 1 - clamp01((V.nahiFall - .65) / .35));
    S.flip.rotation.x = V.flip; S.flip.visible = V.flip < Math.PI / 2 - .01; const up = clamp01(1 - V.flip / (Math.PI / 2)); op(S.dim, .62 * up); op(S.stageSh, .45 * up); S.stageSh.scale.set(1, up, 1); S.stageSh.position.y = -.3 + .33 * up;
    const cf = 1 - V.charFade * .85; S.off.material.opacity *= cf; S.con.material.opacity *= cf * (1 - V.conOut); S.sRed.material.opacity *= 1 - V.sRedFade;
    op(S.scrim, V.scrim); S.scrim.position.y = V.scrimY;
    op(S.stat, V.stat); if (V.stat > 0) T.stat.offset.set(Math.random(), Math.random());
    op(S.ticker, V.tick >= 0 && V.tick < 1 ? Math.min(1, V.tick * 30, (1 - V.tick) * 30) : 0); if (V.tick >= 0) T.ticker.offset.x = t * .06;
    const tb = br === "A" ? t - 34.4 : -1;   // debris & dust are closed-form in time, so they fly back up on rewind
    S.parts.forEach(p => { if (tb < 0 || tb > 3) { op(p.m, 0); return; } p.m.position.set(p.p0.x + p.v.x * tb, p.p0.y + p.v.y * tb - .85 * tb * tb, p.p0.z + p.v.z * tb);
      op(p.m, p.m.position.y > -1.5 ? 1 : 0); p.m.scale.setScalar(p.s); p.m.material.rotation = p.r0 + p.spin * tb; });
    S.puffs.forEach(d => { if (tb < 0 || tb > 2.4) { op(d.m, 0); return; } d.m.position.copy(d.p0).addScaledVector(d.v, tb); d.m.scale.setScalar(.08 + tb * .22); op(d.m, .8 * (1 - tb / 2.4)); });
    const j = V.shake + (vhs ? .006 : 0); S.g.position.set((Math.random() - .5) * j, (Math.random() - .5) * j * (vhs ? .3 : 1), 0);
    const tv = vhs ? .95 : V.news ? .35 : 0; op(S.vhs, tv); op(S.band, vhs ? .55 : 0); op(S.rw, vhs ? (Math.sin(performance.now() / 90) > -.3 ? 1 : .2) : 0);
    if (tv) T.vhs.offset.y = (performance.now() / 700) % 1; if (vhs) S.band.position.y = .75 - ((performance.now() / 900) % 1) * 1.5;
  }

  /* master clock: forward on A → true rewind → forward on B → end */
  let m = 0, last = -1, br = "A", phase = "A", t = 0, rwFrom = 0, bFrom = 0;
  function reset() { m = 0; last = -1; br = "A"; phase = "A"; t = 0; droneOff(); render(0, "A", false); }
  reset();
  return {
    get ended() { return phase === "B" && t > LB + 1.2; }, get t() { return m; }, reset,
    tick(dt) {
      m += dt; let vhs = false;
      if (phase === "A") { t = m; if (t >= LA) { phase = "R"; rwFrom = m; SFX.rewind(RWD); } }
      if (phase === "R") { const r = clamp01((m - rwFrom) / RWD); t = lerp(LA, D, E.io(r)); vhs = r < 1;
        if (r >= 1) { phase = "B"; br = "B"; bFrom = m; last = D; SFX.stop(); droneOn(); } }
      if (phase === "B") t = D + (m - bFrom);
      if (phase !== "R") { for (const c of cues) if ((!c.br || c.br === br) && c.time > last && c.time <= t) c.f(); last = t; }
      render(t, br, vhs);
    },
  };
}

/* ============ boot: camera first, everything else in parallel ============ */
const assets = loadAll();
let story = null, flatTimer = null, stopAR = null;
addEventListener("pointerdown", () => { unlock(); if (story && story.ended) story.reset(); }, { passive: true });

async function startAR() {
  show($("scan"), true);
  let MindARThree;
  try { ({ MindARThree } = await import("mindar-image-three")); } catch (e) { return startFlat(); }
  const mind = new MindARThree({ container: $("stage"), imageTargetSrc: "assets/targets.mind", uiLoading: "no", uiScanning: "no", uiError: "no", filterMinCF: .0001, filterBeta: .001, warmupTolerance: 2, missTolerance: 6 });
  const { renderer, scene, camera } = mind; renderer.outputColorSpace = THREE.SRGBColorSpace;
  const anchor = mind.addAnchor(0); let visible = false;
  anchor.onTargetFound = () => { visible = true; show($("scan"), false); show($("flatLink"), false); clearTimeout(flatTimer); };
  anchor.onTargetLost = () => { visible = false; show($("scan"), true); };
  try { await mind.start(); } catch (e) { $("stage").innerHTML = ""; return startFlat(); }
  flatTimer = setTimeout(() => { if (!visible) show($("flatLink"), true); }, 9000);
  await assets; const S = build(); story = makeStory(S); anchor.group.add(S.root);
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05); S.root.visible = visible; if (visible) story.tick(dt); renderer.render(scene, camera); });
  stopAR = () => { renderer.setAnimationLoop(null); mind.stop(); $("stage").innerHTML = ""; };
}
async function startFlat() {
  if (stopAR) { stopAR(); stopAR = null; } droneOff();
  clearTimeout(flatTimer); show($("scan"), false); show($("flatLink"), false); document.body.classList.add("flat");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace; $("stage").appendChild(renderer.domElement);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(36, 1, .05, 50);
  const fit = () => { const a = innerWidth / innerHeight, f = THREE.MathUtils.degToRad(18); cam.aspect = a; cam.position.set(0, -.04, Math.max(.9 / Math.tan(f), .62 / (Math.tan(f) * a)) * 1.04); cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
  fit(); addEventListener("resize", fit);
  await assets; const S = build(); story = makeStory(S); scene.add(S.root);
  const clock = new THREE.Clock(); let time = 0;
  renderer.setAnimationLoop(() => { const dt = Math.min(clock.getDelta(), .05); time += dt; S.root.rotation.y = Math.sin(time * .4) * .16; S.root.rotation.x = Math.sin(time * .3) * .06; story.tick(dt); renderer.render(scene, cam); });
}
window.__storyTime = () => story ? story.t : -1;
$("flatLink").onclick = () => { unlock(); startFlat(); };
if (new URLSearchParams(location.search).has("flat")) startFlat(); else startAR();
